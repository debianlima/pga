projeto: PGA
nome: Protocolo de Autogovernanca
termos:
  GovernedObject: objeto amplo governado pelo PGA
  PolicySnapshot: snapshot imutavel de politica e autoridade
  EvolutionProposal: proposta de evolucao governada
  HumanPreferenceEvidence: evidencia humana usada como insumo, nao mutacao direta
  PGDMD: protocolo acessorio de governanca de dominio subordinado ao PGA
  NormativeDomainPackage: pacote versionado de modelo/politica/norma/processo/procedimento
    de dominio
  DomainGovernanceException: excecao de dominio que exige autoridade e decisao explicitamente
    referenciadas
  GovernanceAttentionItem:
    definicao: item de atenção humana do PGA para decisão ainda não resolvida, com
      projeto/tarefa/evidência/categoria/opções/impacto/reversibilidade/dependências/deadline/autoridade
      e ações governadas
    limite: decisão RESOLVED/RESOLVED_PROVENANCE sai da fila humana; follow-up técnico
      permanece separado e auditável
  GovernanceTechnicalFollowUp:
    definicao: trabalho técnico rastreável derivado de decisão humana já resolvida,
      sempre ligado ao decision_id e à evidência de origem
    limite: não reabre decisão humana, não cria autoridade e não implica scheduler/lease/runtime
      no PGA
  NetworkServiceAgentPolicy:
    definicao: política PGA que mantém recursos privados por padrão e, após join explícito,
      descreve exatamente dois papéis efêmeros de serviço de rede com escopos não
      sobrepostos
    limite: não materializa runtime, scheduler, worker, lease ou grants; execução
      pertence ao runtime owner
  NetworkControlServiceAgent:
    definicao: papel efêmero único, escopo network-control-only, para interconexão,
      saúde e manutenção da rede descentralizada
    limite: não recebe carga cognitiva distribuída e não ganha acesso implícito a
      recursos privados
  DistributedProcessingServiceAgent:
    definicao: papel efêmero único, escopo distributed-processing-only, para receber/enviar
      carga cognitiva da rede
    limite: não governa interconexão/manutenção e não ganha acesso implícito a recursos
      privados
